<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lab Exercise 2.1</title>
    <style>.highlight { color: crimson; }</style>
</head>
<body>
<h1> Chapter 2 Lab Exercise 2.1 HTML Elements with Attributes</h1>

<!-- Attribute 1: Apply the "id" attribute to an element -->
<p id="intro">This paragraph has an id of "intro".</p>

<!-- Attribute 2: Apply the "class" attribute to multiple elements -->
<p class="highlight">First paragraph using the class "highlight".</p>
<p class="highlight">Second paragraph using the class "highlight".</p>

<!-- Attribute 3: Use the "href" attribute within an anchor tag -->
<p><a href="https://www.umpsa.edu.my/" target="_blank">Visit UMPSA</a></p>

<!-- Attribute 4: Set the "src" attribute of an image element -->
<!-- Attribute 5: Apply the "alt" attribute to describe an image -->
<!-- Attribute 6: Set the "title" attribute to provide additional information -->
<img src="images/profile.png" alt="Profile picture placeholder" title="Hover text: this is my profile picture" width="150">

<!-- Attribute 7: Apply the "style" attribute to an element -->
<p style="color: blue; font-size: 20px;">This text is styled with the style attribute.</p>

<!-- Attribute 8: Use the "disabled" attribute to disable an input -->
<p>Disabled input: <input type="text" value="Cannot edit me" disabled></p>

<!-- Attribute 9: Set the "value" attribute of an input element -->
<p>Name: <input type="text" value="Aqila"></p>

<!-- Attribute 10: Apply the "checked" attribute to a checkbox -->
<p><input type="checkbox" id="agree" checked> <label for="agree">I agree</label></p>
</body>
</html>
